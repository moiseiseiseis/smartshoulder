# Base de datos local de desarrollo: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: rumbo-db
    environment:
      POSTGRES_USER: rumbo
      POSTGRES_PASSWORD: rumbo
      POSTGRES_DB: rumbo
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
