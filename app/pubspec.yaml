name: rumbo
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  audioplayers: ^6.6.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_reactive_ble: ^5.4.1
  flutter_riverpod: ^2.6.1
  flutter_tts: ^4.2.5
  go_router: ^16.1.0
  intl: ^0.20.2
  lucide_icons_flutter: ^3.1.25
  mobile_scanner: ^6.0.11
  permission_handler: 11.4.0
  shared_preferences: ^2.5.3
  uuid: ^4.6.0
  video_player: ^2.10.0
  wakelock_plus: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/sounds/
    - assets/videos/

  # Nunito (SIL OFL 1.1, ver assets/fonts/OFL.txt). Incluida en la app para funcionar sin internet.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900

flutter_native_splash:
  color: "#FAF8F4"
  image: assets/brand/splash-logo.png
  android_12:
    color: "#FAF8F4"
    image: assets/brand/splash-isotipo.png
  web: false
